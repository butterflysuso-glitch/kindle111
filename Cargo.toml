[package]
name = "kindleproject-v2"
version = "2.0.0-alpha.2"
edition = "2021"
description = "Offline-first KindleProject V2 Rust core"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
